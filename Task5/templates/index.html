<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AuraCommerce — Discover premium tech and lifestyle accessories with rapid checkout. Performance-optimized, responsive, and secure.">
    
    <!-- Open Graph SEO Metadata -->
    <meta property="og:title" content="AuraCommerce | Premium Tech Accessories">
    <meta property="og:description" content="Curated minimalist gear and setup tools. Modern e-commerce experience built with Flask & Bootstrap.">
    <meta property="og:type" content="website">
    
    <title>AuraCommerce | Premium Tech Accessories</title>
    
    <!-- Web Icons -->
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    
    <!-- Bootstrap 5 CSS (Slate/Dark Mode Ready) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <!-- App Container -->
    <div id="app" class="d-flex flex-column min-vh-100">
        <!-- Sticky Navigation Header -->
        <header>
            <nav class="navbar navbar-expand-lg border-bottom sticky-top" id="navbarContainer" aria-label="Main navigation">
                <!-- Populated dynamically by JS -->
            </nav>
        </header>

        <!-- Dynamic Main Content -->
        <main class="flex-grow-1" id="mainContent" role="main">
            <!-- Loading Indicator shown during transition -->
            <div id="appSpinner" class="d-flex justify-content-center align-items-center py-5 my-5">
                <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                    <span class="visually-hidden">Loading AuraCommerce...</span>
                </div>
            </div>
            <!-- Dynamic components inject here -->
            <div id="viewContainer"></div>
        </main>

        <!-- Toast Notification Area -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" aria-live="polite" aria-atomic="true">
            <!-- Dynamic Toast Elements Inject Here -->
        </div>

        <!-- Accessible Announcement Live Region -->
        <div id="accessibilityAnnouncer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

        <!-- Footer -->
        <footer class="footer mt-auto border-top py-4 bg-body-tertiary" id="footerContainer">
            <!-- Populated dynamically by JS -->
        </footer>
    </div>

    <!-- Bootstrap Bundle with Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <!-- Modular SPA JavaScript Entry -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
