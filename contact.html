<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with me for freelance projects, job opportunities, or just to say hello.">
    <title>Contact Me | Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <header class="site-header" role="banner">
        <div class="container nav-container">
            <a href="index.html" class="logo" aria-label="Home">DevPortfolio.</a>
            <nav class="main-nav" aria-label="Main Navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content" role="main" class="container">
        <section aria-labelledby="contact-heading">
            <header style="text-align: center; margin-bottom: 2rem;">
                <h1 id="contact-heading">Get In Touch</h1>
                <p>Have a question or want to work together? Fill out the form below.</p>
            </header>

            <div class="contact-wrapper">
                <form action="#" method="POST" aria-label="Contact Form">
                    <div class="form-group">
                        <label for="name">Full Name <span aria-hidden="true">*</span></label>
                        <input type="text" id="name" name="name" required aria-required="true" autocomplete="name" placeholder="John Doe">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address <span aria-hidden="true">*</span></label>
                        <input type="email" id="email" name="email" required aria-required="true" autocomplete="email" placeholder="john@example.com">
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" autocomplete="off" placeholder="Project Inquiry">
                    </div>

                    <div class="form-group">
                        <label for="message">Message <span aria-hidden="true">*</span></label>
                        <textarea id="message" name="message" required aria-required="true" placeholder="Tell me about your project..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="container">
            <nav class="social-links" aria-label="Social Media Links">
                <a href="https://github.com" target="_blank" rel="noopener noreferrer" aria-label="GitHub Profile">GitHub</a>
                <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn Profile">LinkedIn</a>
            </nav>
            <p>&copy; 2026 DevPortfolio. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
