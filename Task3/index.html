<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ZenList - A premium, interactive glassmorphic client-side task manager with advanced state, CRUD, filters, and local persistence.">
  <title>ZenList // Premium Personal Task Space</title>
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Main Glassmorphic Wrapper -->
  <main class="app-container" id="appContainer">
    
    <!-- App Header & Greeting Panel -->
    <header class="app-header">
      <div class="greeting-section">
        <h1 id="greetingText">Hello, Productive Day!</h1>
        <div class="date-widget" aria-live="polite">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke-width="2"/>
            <line x1="16" y1="2" x2="16" y2="6" stroke-width="2"/>
            <line x1="8" y1="2" x2="8" y2="6" stroke-width="2"/>
            <line x1="3" y1="10" x2="21" y2="10" stroke-width="2"/>
          </svg>
          <span id="dateText">Loading Date...</span>
        </div>
      </div>
      
      <!-- Theme Toggle Switch -->
      <div class="header-actions">
        <button id="themeToggleBtn" class="theme-toggle" aria-label="Toggle light and dark theme" title="Toggle Theme">
          <!-- Sun Icon for Light Mode -->
          <svg class="sun-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <circle cx="12" cy="12" r="5" stroke-width="2"/>
            <line x1="12" y1="1" x2="12" y2="3" stroke-width="2"/>
            <line x1="12" y1="21" x2="12" y2="23" stroke-width="2"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke-width="2"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke-width="2"/>
            <line x1="1" y1="12" x2="3" y2="12" stroke-width="2"/>
            <line x1="21" y1="12" x2="23" y2="12" stroke-width="2"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke-width="2"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke-width="2"/>
          </svg>
          <!-- Moon Icon for Dark Mode -->
          <svg class="moon-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke-width="2"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Progress Tracker Widget -->
    <section class="progress-widget" aria-labelledby="progressTitle">
      <div class="progress-info">
        <span id="progressTitle">Progress Completion</span>
        <span id="progressPercent" class="progress-percent">0%</span>
      </div>
      <div class="progress-bar-container">
        <div id="progressBarFill" class="progress-bar-fill" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
    </section>

    <!-- Task Input Panel -->
    <section class="input-panel" aria-label="Add a new task">
      <div class="input-row">
        <div class="input-container">
          <input type="text" id="taskInput" class="task-input" placeholder="Create a new task..." aria-label="Task title input">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <circle cx="11" cy="11" r="8" stroke-width="2"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65" stroke-width="2"/>
          </svg>
        </div>
        <button id="addTaskBtn" class="add-task-btn" aria-label="Add task button" title="Add Task">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>

      <!-- Categories Option Chips -->
      <div class="options-row">
        <div class="category-select-wrapper">
          <span class="category-label">Category:</span>
          <div class="category-chips" id="categoryChips">
            <button class="category-chip active" data-category="work" aria-label="Select Work Category">
              <span>💼</span> Work
            </button>
            <button class="category-chip" data-category="personal" aria-label="Select Personal Category">
              <span>👤</span> Personal
            </button>
            <button class="category-chip" data-category="urgent" aria-label="Select Urgent Category">
              <span>⚡</span> Urgent
            </button>
            <button class="category-chip" data-category="shopping" aria-label="Select Shopping Category">
              <span>🛒</span> Shopping
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Filter & Search Board -->
    <section class="filter-search-container" aria-label="Search and filter tasks">
      <!-- Search Input -->
      <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Search tasks by name..." aria-label="Search tasks input">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <circle cx="11" cy="11" r="8" stroke-width="2"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65" stroke-width="2"/>
        </svg>
      </div>

      <!-- State Filters (Tabs) -->
      <nav class="filters-tabs" aria-label="Task state navigation">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="active">Active</button>
        <button class="filter-tab" data-filter="completed">Completed</button>
      </nav>
    </section>

    <!-- Tasks Display Area -->
    <section id="tasksDisplaySection" aria-label="List of tasks">
      <div id="tasksContainer" class="tasks-container">
        <!-- Rendered Dynamically via JS -->
      </div>
    </section>

    <!-- Stats & Cleanup Footer -->
    <footer class="app-footer">
      <div class="stats-count">
        <span id="itemsLeftCount">0</span> tasks left
      </div>
      <button id="clearCompletedBtn" class="clear-btn" aria-label="Clear all completed tasks" title="Clear Completed">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <polyline points="3 6 5 6 21 6" stroke-width="2"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke-width="2"/>
        </svg>
        Clear Completed
      </button>
    </footer>

  </main>

  <!-- JavaScript Application -->
  <script src="app.js"></script>
</body>
</html>
